<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex nofollow">
    <title>Super Market Together Preis</title>
</head>
<body>
    <div class="row market-price">
        <label for="market-price">Markt Preis</label>
        <input type="number" name="market-price" id="market-price" step="0.01">
    </div>
    <div class="row our-price">
        <label for="our-price">Unser Preis</label>
        <input type="number" name="our-price" id="our-price" disabled>
    </div>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            height: 50vh;
            font-family: sans-serif;
            background-color: #121214;
            color: #d9d9da;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3rem;
        }

        label {
            font-size: 24px;
            font-weight: 500;
        }

        .row {
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
        }

        input {
            padding: 1rem;
            border: none;
            width: 75%;
            border-radius: 1rem;
            background-color: #1a1a1e;
            color: inherit;
        }

        input:focus {
            outline: none;
        }
    </style>

    <script>
        const input = document.getElementById('market-price')
        const output = document.getElementById('our-price')

        input.addEventListener('input', (e) => {
            const new_value = event.target.value * 2 * 0.95
            console.log(new_value)
            output.value = Math.round(new_value * 100) / 100
        })
    </script>
</body>

</html>
