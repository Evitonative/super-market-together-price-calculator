<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=check,close,content_copy" />
    <title>Supermarket Together Pricing Calculator</title>
    <style>
        :root {
            --background: #100215;
            --text: #f4defb;
            --card: #1a0820;
            --input-bg: #371b41;
            --chip-active: #d47ff1;
            --chip-inactive: #400836;
            --pad: 1.5rem
        }

        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }

        * {
            box-sizing: border-box;
        }

        *::selection {
            background-color: var(--chip-active);
            color: var(--background);
        }

        body {            
            font-family: "IBM Plex Mono", monospace;
            background-color: var(--background);
            width: min(560px, 100%);
            margin: var(--pad) auto;
            padding: var(--pad);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }

        main {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--pad);
        }

        h1 {
            font-family: "Orbitron", sans-serif;
            text-transform: initial;
            text-align: center;
            user-select: none;
            font-size: 2rem;
            margin: 0;
        }

        h2 {
            user-select: none;
            font-size: 1.5rem;
            font-weight: 500;
            margin: 0;
        }

        .calculator {
            display: flex;
            flex-direction: column;
            gap: var(--pad);
        }

        .card {
            border-radius: var(--pad);
            background-color: var(--card);
            flex-direction: column;
            align-items: center;
            padding: var(--pad);
            gap: var(--pad);
            display: flex;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .num-value-wrapper {
            width: 100%;
            position: relative;
        }

        .num-value-wrapper::after {
            content: "$";
            left: calc(var(--pad)/1.25);
            top: 50%;
            transform: translateY(-50%);
            color: var(--chip-active);
            font-size: 1.25rem;
            position: absolute;
            opacity: 0.75;
        }

        .input-action {
            position: absolute;
            right: calc(var(--pad)/1.25);
            top: 50%;
            transform: translateY(-50%);
            user-select: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .input-action:active {
            transform: translateY(-50%) scale(0.85);
        }

        .input-action.hidden {
            transform: translateY(-50%) scale(0);
            opacity: 0;
        }

        .input-action#copy-output {
            display: none;
        }

        .input-action.copied {
            transform: translateY(-50%) scale(1.2);
            color: var(--chip-active);
        }

        .num-value {
            background-color: var(--input-bg);
            padding: calc(var(--pad)/1.25);
            border-radius: 1rem;
            font-size: 1.25rem;
            text-align: center;
            color: inherit;
            font: inherit;
            font-weight: 500;
            border: none;
            width: 100%;
        }

        input:focus {            
            outline: 2px solid var(--chip-active);
            outline-offset: 4px;
        }

        .chip-select {
            display: flex;           
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--pad);
        }

        .chip-select input[type=radio]{
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .chip {
            background-color: var(--chip-inactive);
            border-radius: var(--pad);
            padding: calc(var(--pad)/2) calc(var(--pad)*1.5);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        
        .chip:hover {
            transform: scale(1.05);
        }

        .chip:active {
            transform: scale(0.95);
        }        

        .chip:has(input:focus-visible) {
            outline: 2px solid var(--chip-active);
            outline-offset: 4px;
        }

        .chip:has(input[type="radio"]:checked) {
            background-color: var(--chip-active);
            color: var(--background);
            font-weight: 700;
        }

        @keyframes pulse {
            0% { transform: scaleX(1) scaleY(1); }
            50% { transform: scaleX(1.01) scaleY(1.05); }
            100% { transform: scaleX(1) scaleY(1) }
        }
        
        .updated {
            animation: pulse 0.2s ease-in-out;
        }
    </style>
</head>
<body>
    <main>
        <h1>Supermarket Together Pricing Calculator</h1>

        <div class="calculator">
            <div class="card">
                <h2><label for="market-price">Purchase Price</label></h2>                
                <div class="num-value-wrapper">
                    <input class="num-value" type="text" inputmode="decimal" id="market-price" placeholder="0.00" autocomplete="off">
                    <span class="input-action material-symbols-outlined" id="clear-input" role="button" aria-label="Clear input">close</span>
                </div>
            </div>

            <div class="card">
                <h2><label for="our-price">Sale Price</label></h2>
                
                <div class="chip-select">
                    <label class="chip" for="multi-1-9">
                        <input type="radio" name="multi" id="multi-1-9" checked>
                        <span>1.9x</span>
                    </label>
                    
                     <label class="chip" for="multi-2">
                        <input type="radio" name="multi" id="multi-2">
                        <span>2x</span>
                    </label>
                    
                     <label class="chip" for="multi-2-round">
                        <input type="radio" name="multi" id="multi-2-round">
                        <span>2x (round)</span>
                    </label>
                </div>

                <div class="num-value-wrapper">
                    <input class="num-value" type="text" name="our-price" id="our-price" aria-live="polite" readonly>
                    <span class="input-action material-symbols-outlined" id="copy-output" role="button" aria-label="Copy sale price">content_copy</span>
                </div>
            </div>
        </div>
    </main>    

    <script>
        const input = document.getElementById('market-price')
        const output = document.getElementById('our-price')
        const selContainer = document.querySelector('.chip-select');
        const chips = selContainer.querySelectorAll('.chip');
        const clearButton = document.getElementById('clear-input')
        const copyButton = document.getElementById('copy-output')

        if (navigator.clipboard) {
            copyButton.style.display = 'inline-block';
        }

        function update_calc() {
            if (input.value === '') clearButton.classList.add('hidden');
            else clearButton.classList.remove('hidden');

            let cleanInput = input.value.replaceAll(',', '.')
                                        .replace(/[^\d.]/g, '')
                                        .replace(/(\..*?)\..*/g, '$1');
            const purchasePrice = parseFloat(cleanInput);

            if (isNaN(purchasePrice) || purchasePrice <= 0) {
                output.value = '0.00';
                return;
            }

            const selectedRadio = document.querySelector('.chip-select input[name="multi"]:checked');
            let salePrice = 0.0;

            switch (selectedRadio.id) {
                case 'multi-1-9': salePrice = purchasePrice * 1.9; break;
                case 'multi-2': salePrice = purchasePrice * 2; break;
                case 'multi-2-round': salePrice = Math.floor(purchasePrice * 2 * 10) / 10; break;
            }

            output.value = salePrice.toFixed(2);

            output.classList.remove('updated');
            void output.offsetWidth;
            output.classList.add('updated');
        }

        // Focus Logic
        const keepFocusItems = document.querySelectorAll('.chip, #clear-input, #copy-output');
        keepFocusItems.forEach(item => {
            let hadFocus = false;

            function restore_focus() {
                if (hadFocus) {
                    requestAnimationFrame(() => input.focus());
                }
            }

            item.addEventListener('pointerdown', (e) => {
                hadFocus = document.activeElement === input;
                restore_focus();
            });

            item.addEventListener('pointerup', restore_focus)
        });
        
        // Event Listeners   
        input.addEventListener('input', (e) => update_calc())

        clearButton.addEventListener('click', (e) => {
            input.value = '';
            input.focus();
            update_calc();
        })

        selContainer.addEventListener('change', (e) => {
            update_calc();
        })        

        copyButton.addEventListener('click', (e) => {
            const originalText = copyButton.textContent;
            navigator.clipboard.writeText(output.value).then(() => {
                copyButton.textContent = "check";
                copyButton.classList.add("copied");
                setTimeout(() => {
                    copyButton.textContent = originalText;                
                    copyButton.classList.remove("copied");
                }, 1500);
            });            
        })

        // Action On First Run
        update_calc()
    </script>
</body>
</html>
